<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Hush</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f6f6f6" />
  <script src="/js/lang-boot.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    .not-found {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--color-signal-sky);
    }

    .not-found-card {
      width: min(520px, 100%);
      padding: 42px;
      border: 1px solid var(--color-fog);
      border-radius: var(--radius-panels);
      background: var(--color-white);
      box-shadow: var(--shadow-md);
    }

    .not-found-code {
      color: var(--color-signal-blue);
      font-size: 0.75rem;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .not-found-card h1 {
      margin: 14px 0 12px;
      font-size: clamp(2rem, 6vw, 2.75rem);
      line-height: 1.08;
    }

    .not-found-card p {
      max-width: 380px;
      color: var(--color-slate);
    }

    .not-found-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-top: 26px;
    }

    .not-found .brand {
      margin-bottom: 26px;
    }

    .not-found-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    .not-found-head .brand {
      margin-bottom: 0;
    }

    .not-found-credit {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--color-fog);
      color: var(--color-slate);
      font-size: 0.75rem;
    }

    .not-found-credit a {
      font-weight: var(--font-weight-semibold);
    }

    .not-found-credit-ar {
      font-family: var(--font-arabic);
      color: var(--color-ink);
    }

    @media (max-width: 460px) {
      .not-found-card {
        padding: 28px;
      }
    }
  </style>
</head>
<body class="not-found" data-title-key="meta.notFoundTitle">
  <main class="not-found-card">
    <div class="not-found-head">
      <a class="brand" href="/" aria-label="Hush home">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M4 6.5A3.5 3.5 0 0 1 7.5 3h13A3.5 3.5 0 0 1 24 6.5v9a3.5 3.5 0 0 1-3.5 3.5H13l-5.5 4v-4H7.5A3.5 3.5 0 0 1 4 15.5v-9Z" fill="currentColor"/>
          <circle cx="9.5" cy="11.5" r="1.5" fill="#fff"/>
          <circle cx="14" cy="11.5" r="1.5" fill="#fff"/>
          <circle cx="18.5" cy="11.5" r="1.5" fill="#fff"/>
        </svg>
        <span>Hush</span>
      </a>
      <button class="theme-toggle" type="button" data-theme-toggle title="Switch to dark theme" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <span data-theme-label>Dark</span>
      </button>
      <button class="lang-toggle" type="button" data-lang-toggle title="Switch language" aria-label="Switch language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3.5 9h17M3.5 15h17" />
          <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z" />
        </svg>
        <span data-lang-label>العربية</span>
      </button>
    </div>

    <p class="not-found-code">404</p>
    <h1>This room isn't here.</h1>
    <p>The page or room code you followed doesn't exist. Check the link, or open a fresh room and invite the people you wanted to talk to.</p>

    <div class="not-found-actions">
      <a class="btn btn-primary" href="/">Back to Hush</a>
      <a class="link-button" href="/#how">How rooms work</a>
    </div>

    <p class="not-found-credit">
      Built by
      <a href="https://github.com/mouadkennedy2001" target="_blank" rel="noopener noreferrer" data-no-translate>Zerouki Ahmed Mouad</a>
      <span class="not-found-credit-ar" dir="rtl">زروقي احمد معاذ</span>
      · <a href="https://github.com/mouadkennedy2001" target="_blank" rel="noopener noreferrer">GitHub</a>
      · <a href="https://www.instagram.com/mouad_kennedy/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </p>
  </main>
  <script type="module" src="/js/static-page.js"></script>
</body>
</html>
